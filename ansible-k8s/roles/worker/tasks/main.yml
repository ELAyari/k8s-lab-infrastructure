---
- name: Check whether this node has already joined a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join the cluster
  ansible.builtin.command: >-
    {{ hostvars['join_command_holder']['kubeadm_join_command'] }}
  when: not kubelet_conf.stat.exists
  register: join_result

- name: Show join output
  ansible.builtin.debug:
    msg: "{{ join_result.stdout_lines }}"
  when: not kubelet_conf.stat.exists and join_result is defined and join_result.stdout_lines is defined
