---
- name: Prepare all nodes (packages, containerd, pinned k8s versions)
  hosts: k8s_cluster
  become: true
  roles:
    - common

- name: Initialize control plane
  hosts: masters
  become: true
  roles:
    - master

- name: Join worker nodes
  hosts: workers
  become: true
  roles:
    - worker

- name: Verify cluster state from master
  hosts: masters
  become: true
  tasks:
    - name: Get node status
      ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes -o wide
      register: final_nodes
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.debug:
        msg: "{{ final_nodes.stdout_lines }}"

    - name: Get kube-system pod status
      ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -n kube-system -o wide
      register: final_pods
      changed_when: false

    - name: Show kube-system pods
      ansible.builtin.debug:
        msg: "{{ final_pods.stdout_lines }}"
